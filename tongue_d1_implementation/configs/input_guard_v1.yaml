policy_version: '1.4'
threshold_status: engineering_heuristic
capability_coverage:
  defined_checks: 11
  implemented_checks: 11
  active_checks: 10
  production_supported_checks: 10
  deferred_checks: 1
  guard_ready: true
  full_capability_coverage: false
known_limitations:
- code: STAIN_DETECTION_DEFERRED
  reason: SOURCE_DATASET_CONFOUNDING_SEVERE
  affects_decision: false
capture_guidance:
- 拍摄前请尽量避免近期摄入可能明显改变舌面颜色的有色食物、饮料、药物或漱口液；当前版本暂不具备可靠的外源染色自动识别能力。
notes:
- Quality checks evaluate capture suitability, not disease/phenotype.
- Pathological tongue color/coating/crack/toothmark are NOT QC fail reasons.
- Stain suspected is contamination/quality, not pathological coating.color.
- D4-B thresholds calibrated on BioHit+TongueSet3 train+val only; test excluded.
- D4-C stain_suspected research thresholds remain 0.95/0.96 but production disabled.
- D4-D color_cast/occlusion calibrated on BioHit+TongueSet3 train+val only; test excluded. Synthetic perturbations used for sensitivity only.
- "D4-E: stain_suspected deferred due to SOURCE_DATASET_CONFOUNDING_SEVERE; research artifacts preserved; production decision_effect=none."
- Downstream D5 coating-color phenotype cannot assume external staining is excluded.
