# D4-C.1-C：representation-level domain invariance stain contract（不覆盖 v1/v2）
version: "1.2"
name: stain_detection_contract_v3

parent_contract: configs/stain_detection_v2.yaml
task: quality.stain_suspected
dataset: stained_coating
dataset_role: quality_only_auxiliary_supervision

semantics:
  positive: "外源染色嫌疑（食物/饮料/药物/色素等）"
  negative: "无明显外源染色嫌疑"
  forbidden:
    - coating.color
    - phenotype_inference
    - disease_diagnosis
    - external_pseudo_labels
    - domain_specific_thresholds

input:
  type: masked_tongue_roi
  size: 224
  preserve_aspect_ratio: true
  mask_outside_fill: 0
  color_space: RGB
  representation: black_masked_roi
  normalization:
    type: imagenet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

roi:
  source: d3e_segmentation
  bbox: bbox_roi
  require_valid_roi: true
  min_roi_success_rate: 0.99

labels:
  field: canonical_label
  true_values: ["true", true, "1", 1]
  false_values: ["false", false, "0", 0]
  external_domains_have_gold: false
  # domain identity 仅作元数据，不是 stain supervision
  domain_label_allowed: true
  domain_classes: [stained, biohit, tongueset3]

split:
  inherit_from: d2_frozen
  policy: configs/split_policy_v1.yaml

external_unlabeled:
  datasets: [biohit, tongueset3]
  train_only_for_consistency_and_domain: true
  forbid_pseudo_labels: true
  forbid_entropy_minimization: true
  forbid_self_training: true

representation:
  mixstyle: optional
  domain_adversarial_grl: optional
  inference_requires_domain_label: false
