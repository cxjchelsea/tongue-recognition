version: "1.0"
name: stain_train_v1
data_contract: configs/stain_detection_v1.yaml

model:
  architecture: resnet18
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

loss:
  name: bce_with_logits
  pos_weight: null

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  mode: max
  factor: 0.5
  patience: 3
  min_lr: 1.0e-6

training:
  epochs: 30
  batch_size: 32
  num_workers: 0
  amp: true
  device: auto
  gradient_clip_norm: null

early_stopping:
  enabled: true
  patience: 7

checkpoint:
  monitor: val_auroc
  mode: max

augmentation:
  train:
    horizontal_flip: true
    rotation_degrees: 10
    scale_min: 0.9
    scale_max: 1.1
    translate_frac: 0.05
    # 禁止 hue/saturation/color jitter / grayscale
    color_jitter: false
    brightness_contrast: false
  val:
    enabled: false
  test:
    enabled: false

calibration:
  target_confident_precision: 0.90
  # t_clear / t_retake 仅用 val；禁止默认 0.3/0.7

metrics:
  primary: val_auroc

reproducibility:
  seed: 20260813

gates:
  target:
    test_auroc: 0.90
    confident_stain_precision: 0.90
    stain_recall: 0.90
    confident_clean_purity: 0.90
  minimum:
    test_auroc: 0.85
    confident_stain_precision: 0.85
    stain_recall: 0.85
    confident_clean_purity: 0.85

smoke:
  epochs: 2
  max_train_batches: 5
  max_val_batches: 5

overfit:
  sample_count: 16
  positives: 8
  negatives: 8
  epochs: 40
  accuracy_gate: 0.95
