[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tongue-data-contract"
version = "0.3.5"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14.0", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
segmentation = ["torch>=2.0"]
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation-models-pytorch>=0.3.3",
]

[project.scripts]
tongue-data = "tongue_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
