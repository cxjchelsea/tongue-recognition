dataset: tonguexpert
version: "1.0"
sources:
  L1: {annotation_type: image_level, label_source: human, supervision_tier: gold_candidate}
  L2: {annotation_type: image_level, label_source: model_prediction, supervision_tier: pseudo}
mappings:
  L1.labels_tai.white: {status: exact, canonical_task: coating.color, canonical_label: white}
  L1.labels_tai.light_yellow: {status: exact, canonical_task: coating.color, canonical_label: light_yellow}
  L1.labels_tai.yellow: {status: exact, canonical_task: coating.color, canonical_label: yellow}
  L1.labels_zhi.light: {status: compatible, canonical_task: tongue_body.color, canonical_label: pale}
  L1.labels_zhi.regular: {status: compatible, canonical_task: tongue_body.color, canonical_label: normal}
  # dark=暗舌色，保留独立 canonical；禁止等同 purple（紫舌来自 TMC zishe）
  L1.labels_zhi.dark: {status: exact, canonical_task: tongue_body.color, canonical_label: dark, reason: "source dark means dusky/dark tongue body color, not purple"}
  L1.labels_fissure.light:
    status: exact
    canonical_task: features.crack.severity
    canonical_label: mild
    derive: [{canonical_task: features.crack.present, canonical_label: true}]
  L1.labels_fissure.severe:
    status: exact
    canonical_task: features.crack.severity
    canonical_label: severe
    derive: [{canonical_task: features.crack.present, canonical_label: true}]
  L1.labels_tooth_mk.light:
    status: exact
    canonical_task: features.tooth_mark.severity
    canonical_label: mild
    derive: [{canonical_task: features.tooth_mark.present, canonical_label: true}]
  L1.labels_tooth_mk.severe:
    status: exact
    canonical_task: features.tooth_mark.severity
    canonical_label: severe
    derive: [{canonical_task: features.tooth_mark.present, canonical_label: true}]
  L2.coating_label.non_greasy: {status: compatible, canonical_task: coating.properties.greasy, canonical_label: none}
  L2.coating_label.greasy: {status: compatible, canonical_task: coating.properties.greasy, canonical_label: greasy}
  L2.coating_label.greasy_thick: {status: compatible, canonical_task: coating.properties.greasy, canonical_label: greasy_thick}
  L2.tai_label.white: {status: exact, canonical_task: coating.color, canonical_label: white}
  L2.tai_label.light_yellow: {status: exact, canonical_task: coating.color, canonical_label: light_yellow}
  L2.tai_label.yellow: {status: exact, canonical_task: coating.color, canonical_label: yellow}
  L2.zhi_label.light: {status: compatible, canonical_task: tongue_body.color, canonical_label: pale}
  L2.zhi_label.regular: {status: compatible, canonical_task: tongue_body.color, canonical_label: normal}
  # dark=暗舌色，保留独立 canonical；禁止等同 purple
  L2.zhi_label.dark: {status: exact, canonical_task: tongue_body.color, canonical_label: dark, reason: "source dark means dusky/dark tongue body color, not purple"}
  L2.fissure_label.None: {status: exact, canonical_task: features.crack.present, canonical_label: false}
  L2.fissure_label.light:
    status: exact
    canonical_task: features.crack.severity
    canonical_label: mild
    derive: [{canonical_task: features.crack.present, canonical_label: true}]
  L2.fissure_label.severe:
    status: exact
    canonical_task: features.crack.severity
    canonical_label: severe
    derive: [{canonical_task: features.crack.present, canonical_label: true}]
  L2.tooth_mk_label.None: {status: exact, canonical_task: features.tooth_mark.present, canonical_label: false}
  L2.tooth_mk_label.light:
    status: exact
    canonical_task: features.tooth_mark.severity
    canonical_label: mild
    derive: [{canonical_task: features.tooth_mark.present, canonical_label: true}]
  L2.tooth_mk_label.severe:
    status: exact
    canonical_task: features.tooth_mark.severity
    canonical_label: severe
    derive: [{canonical_task: features.tooth_mark.present, canonical_label: true}]
